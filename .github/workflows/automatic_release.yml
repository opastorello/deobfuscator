# Builds the shaded jar on JDK 17 (bytecode targets Java 11, so the jar runs on JDK 11-25+)
# and publishes it as the rolling "latest" release.
name: Java CI with Maven

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
    - name: Build with Maven
      run: ./mvnw -B package --file pom.xml
    - name: Rename final file
      run: mv target/deobfuscator-*.jar target/deobfuscator.jar
    - name: Prerelease
      uses: "marvinpinto/action-automatic-releases@latest"
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "latest"
        prerelease: false
        title: "Latest Build"
        files: |
          LICENSE
          target/deobfuscator.jar
